name: Release

on:
  push:
    tags:
      # Release on version tags only, e.g. `1.0.0` or `1.0.0rc1`. Any other tag
      # would otherwise start a release and fail the version check below.
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  git-tag-check:
    name: Git Tag Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      # This is the version of the action for setting up Python, not the Python version.
      uses: actions/setup-python@v5
      with:
        # Semantic version range syntax or exact version of a Python version
        python-version: '3.x'
    - name: Check Git Tag
      env:
        # Passed through the environment rather than interpolated into the
        # script, so a tag name can never be injected as code.
        GIT_TAG: ${{ github.ref_name }}
      run: |
        python - <<'HEREDOC'
        import os
        import sys
        import tomllib
        from pathlib import Path

        pyproject = tomllib.loads(Path("pyproject.toml").read_text())
        version = pyproject["project"]["version"]
        git_tag = os.environ["GIT_TAG"]

        if version != git_tag:
            sys.exit(f"Git tag '{git_tag}' doesn't match package version '{version}'")
        print(f"Git tag '{git_tag}' matches the package version.")
        HEREDOC

  test:
    name: Test
    needs: [git-tag-check]
    uses: ./.github/workflows/test.yml

  test-matrix:
    # A release advertises support for every Python and pytest version in the
    # classifiers, so validate them before publishing rather than only on PRs.
    name: Test Matrix
    needs: [git-tag-check]
    uses: ./.github/workflows/test-matrix.yml

  build:
    name: Build
    needs: [test, test-matrix]
    uses: ./.github/workflows/build.yml

  github-release:
    needs: [build]
    name: GitHub Upload
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        '${{ github.ref_name }}'
        --repo '${{ github.repository }}'
        --generate-notes
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        '${{ github.ref_name }}' dist/**
        --repo '${{ github.repository }}'

  publish-to-testpypi:
    name: Publish to TestPyPi
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pytest-jig
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        # TestPyPI is a rehearsal target: a version already uploaded there must
        # not block the release from reaching PyPI.
        skip-existing: true

  publish-to-pypi:
    name: Publish to PyPI
    needs:
    - publish-to-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytest-jig
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
