[project]
    # Distribution name on PyPI. The import name stays `jig`; `jig.__version__`
    # resolves this distribution's metadata, so keep both in sync.
    name = "pytest-jig"
    version = "1.0.0"
    description = "Jig library for device testing"
    license = "GPL-3.0-or-later"
    authors = [{ name = "Everypin", email = "info@everypin.io" }]
    readme = "README.md"
    classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Framework :: Pytest",
        "Intended Audience :: Developers",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Topic :: Software Development :: Libraries",
        "Topic :: Software Development :: Testing",
        "Topic :: Software Development :: Testing :: Acceptance",
        "Topic :: Utilities",
    ]
    # The upper bound is required by dependency resolvers, several dependencies
    # (qrcode, wemake-python-styleguide) declare `python <4.0` themselves.
    requires-python = ">=3.10,<4"
    dependencies = [
        "pycouchdb>=1.14.2, <2",
        "glom>=23.3.0",
        "pydantic>=2.4.0, <3",
        "natsort>=8.4.0",
        "pytest>=7",
        "typer>=0.12,<1",
        "tomli_w>=1.1.0, <2",
        "tomli>=2.0.1, <3",
        "py-machineid~=0.6.0",
        "tzlocal~=5.2",
        "uuid6",
        "python-dotenv",

        # Frontend
        "fastapi>=0.100.1",
        "uvicorn>=0.23.2",

        # StandCloud
        "oauthlib>=3.1.0, <4",
        "jinja2>=3, <4",
        "requests>=2.30.0, <3",
        "requests-oauth2client>=1.5.0, <2",
        "requests-oauthlib>=2.0.0, <3",
        "keyring>=25.0.0, <26",
        "qrcode>=8",
    ]

    [project.optional-dependencies]
        dev = ["wemake-python-styleguide>=0.19.2", "mypy>=1.11.0", "ruff==0.8.0"]
        build = ["build==1.0.3"]
        tests = [
            "psutil~=7.0.0",
            "pytest-timeout==2.4.0"
        ]

    [project.urls]
        Homepage = "https://github.com/samuelint/jig/"
        Repository = "https://github.com/samuelint/jig/"

    [project.scripts]
        # Provide `jig` executable
        jig = "jig.cli.cli:cli"
        # Provide `example` executable, i.e. `poetry run example hello_jig`
        example = "jig.cli.example:cli"

    [project.entry-points.pytest11]
        pytest_jig = "jig.pytest_jig.plugin"

[build-system]
    requires = ["hatchling==1.27.0"]
    build-backend = "hatchling.build"

[tool.poetry]
    # Poetry does not read the hatchling target below, and it cannot infer the
    # package directory because the distribution name (`pytest-jig`) differs from
    # the import name (`jig`). Needed for `poetry install` of the root project.
    packages = [{ include = "jig" }]

[tool.hatch.build]
    # Do not package non python related filed
    only-packages = true

    # Hatch exclude by default everything pointed
    # in root .gitignore
    # Add non root items here
    exclude = ["**/frontend/dist", "**/frontend/node_modules"]

    # Despite excluded files keep build app artifact
    artifacts = ["**/frontend/dist"]

    [tool.hatch.build.targets.wheel]
        packages = ["jig"]

    # Custom build hook for sdist source package.
    # It additionally runs `yarn` and `yarn build`
    # in React app folder to bundle prod build
    [tool.hatch.build.targets.sdist.hooks.custom]
        path = "scripts/hatch_build.py"
